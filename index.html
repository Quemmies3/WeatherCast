<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeatherCast</title>

  <link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/micro-interactions.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            WeatherCast
        </div>

        <form id="search-form">
            <div class="search-field">
                <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>

                <label class="sr-only" for="city-input">City name</label>
                <input
                    id="city-input"
                    type="search"
                    placeholder="Search city..."
                />
            </div>

            <button type="submit">
                Search
            </button>
        </form>

        <div class="unit-toggle">
            <!-- "active" is set here so the page matches currentUnit = "celsius" on load -->
            <button id="celsius-btn" class="active">°C</button>
            <button id="fahrenheit-btn">°F</button>
        </div>
    </header>


    <main class="dashboard">

        <div class="weather-main">


      <div id="loading" role="status" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span>Loading weather…</span>
      </div>

      <div id="error" role="alert" hidden></div>

  

            <section id="current-weather" aria-label="Current weather">
                <!-- Current weather -->
                <p class="placeholder">Search for a city to see the weather.</p>
            </section>

            <section id="forecast" aria-label="5-day forecast">
                <!-- 5-day forecast -->
                <div class="forecast-card"><span class="placeholder">--</span></div>
                <div class="forecast-card"><span class="placeholder">--</span></div>
                <div class="forecast-card"><span class="placeholder">--</span></div>
                <div class="forecast-card"><span class="placeholder">--</span></div>
                <div class="forecast-card"><span class="placeholder">--</span></div>
            </section>

        </div>

        <section id="recent-searches" aria-label="Recent searches">
            <!-- Recent searches -->
            <h2>Recent Searches</h2>
        </section>

    </main>


    <footer class="attribution">
        Weather data by <a href="https://open-meteo.com/">Open-Meteo.com</a>.
        Icons by <a href="https://meteocons.com/">Meteocons</a>.
    </footer>

    <script type="module" src="js/app.js"></script>
<script src="js/micro-interactions.js" defer></script>
</body>
</html>
