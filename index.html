<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeatherCast Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard-container">
    <header class="app-header">
      <h1>WeatherCast</h1>
      
      <!-- Search Form -->
      <form id="search-form" class="search-box">
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search city..." 
          aria-label="Search city"
          autocomplete="off"
        >
        <button type="submit" class="btn-search" aria-label="Submit search">Search</button>
      </form>

      <!-- Unit Toggle -->
      <div class="unit-toggle-container">
        <button id="toggle-unit-btn" class="btn-toggle" aria-label="Toggle Temperature Unit">
          Switch to <span id="unit-target-label">°F</span>
        </button>
      </div>
    </header>

    <main class="dashboard-content">
      <!-- Current Weather Section -->
      <section id="weather-card" class="weather-card">
        <h2 id="city-name">New York</h2>
        <div class="temp-display">
          <span id="temperature-value" class="fade-target">22</span>
          <span id="unit-symbol">°C</span>
        </div>
        <p id="weather-description" class="fade-target">Partly Cloudy</p>
      </section>

      <!-- Forecast Section -->
      <section class="forecast-section">
        <h3>5-Day Forecast</h3>
        <div id="forecast-grid" class="forecast-grid">
          <div class="forecast-card">
            <span class="day">Mon</span>
            <span class="forecast-temp fade-target" data-temp-c="20" data-temp-f="68">20°C</span>
            <span class="condition">Sunny</span>
          </div>
          <div class="forecast-card">
            <span class="day">Tue</span>
            <span class="forecast-temp fade-target" data-temp-c="18" data-temp-f="64">18°C</span>
            <span class="condition">Rain</span>
          </div>
          <div class="forecast-card">
            <span class="day">Wed</span>
            <span class="forecast-temp fade-target" data-temp-c="22" data-temp-f="72">22°C</span>
            <span class="condition">Cloudy</span>
          </div>
          <div class="forecast-card">
            <span class="day">Thu</span>
            <span class="forecast-temp fade-target" data-temp-c="25" data-temp-f="77">25°C</span>
            <span class="condition">Sunny</span>
          </div>
          <div class="forecast-card">
            <span class="day">Fri</span>
            <span class="forecast-temp fade-target" data-temp-c="21" data-temp-f="70">21°C</span>
            <span class="condition">Clear</span>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
